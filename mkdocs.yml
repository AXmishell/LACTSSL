# 默认站点配置（英文）：构建到根目录；中文站点由 mkdocs.zh.yml 构建到 /zh/。
# 本地预览双语站点请使用 scripts/docs-serve.sh（或 make docs-serve），
# 因为 `zensical serve` 一次只能构建一种配置。
site_name: LACTSSL
site_url: https://lactssl.gpcn.cc/
site_description: "Self-hosted SSL certificate management for enterprise IT, security, and operations teams: ACME issuance and auto-renewal, deployment, endpoint monitoring, private CA, and internal ACME."
repo_url: https://github.com/AXmishell/LACTSSL
repo_name: AXmishell/LACTSSL
edit_uri: edit/main/docs/en/
copyright: Copyright &copy; LACTSSL · MIT License

docs_dir: docs/en
site_dir: site

theme:
  name: material
  variant: modern
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Evaluate and deploy:
      - Evaluate and roll out: getting-started.md
      - Installation: install.md
      - Architecture: architecture.md
  - Administration:
      - Administration workspace: administration.md
      - Capabilities: features.md
      - Plugin governance: plugins.md
  - Integration and security:
      - API integration: api.md
      - Security baseline: security.md
  - Operations:
      - Operations handbook: operations.md
      - Upgrade and change: upgrade.md
      - Monitoring and troubleshooting: troubleshooting.md
  - Reference:
      - Configuration: configuration.md
      - DNS plugins: dns-plugins.md
      - Deployment plugins: deploy-plugins.md
      - Notification plugins: notify-plugins.md
  - Extension development:
      - Source and build: development.md
      - Plugin protocol: plugin-development.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  alternate:
    - name: 简体中文
      link: /zh/
      lang: zh
    - name: English
      link: /
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AXmishell/LACTSSL
      name: GitHub repository
