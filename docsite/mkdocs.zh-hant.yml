# 繁體中文站點設定：建置到 /zh-hant/，預設站點為英文（mkdocs.yml）。
# 本機預覽多語言站點請使用 scripts/docs-serve.sh（或 make docs-serve），
# 因為 `zensical serve` 一次只能建置一種設定。
# 注意：Zensical 以本檔案所在目錄（docsite/）為專案根，docs_dir/site_dir 不可指向其外部。
site_name: LACTSSL
site_url: https://lactssl.gpcn.cc/zh-hant/
site_description: "自託管 SSL 證書管理：ACME 申請與自動續期、證書部署、到期監控、私有 CA 與內部 ACME 服務。"
repo_url: https://github.com/AXmishell/LACTSSL
repo_name: AXmishell/LACTSSL
edit_uri: edit/main/docsite/docs/zh-hant/
copyright: Copyright &copy; LACTSSL · MIT License

docs_dir: docs/zh-hant
site_dir: site/zh-hant

theme:
  name: material
  variant: modern
  language: zh-Hant
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換到淺色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

nav:
  - 首頁: index.md
  - 開始使用:
      - 快速開始: getting-started.md
      - 安裝與啟動: install.md
      - 部署架構: architecture.md
  - 使用指南:
      - 產品能力: features.md
      - 管理工作台: administration.md
      - 外掛治理: plugins.md
      - API 整合: api.md
      - 安全基線: security.md
  - 維運:
      - 維運手冊: operations.md
      - 升級與變更: upgrade.md
      - 監控與排障: troubleshooting.md
  - 參考:
      - 設定參考: configuration.md
      - DNS 外掛: dns-plugins.md
      - 部署外掛: deploy-plugins.md
      - 通知外掛: notify-plugins.md
  - 開發:
      - 原始碼與建置: development.md
      - 外掛開發: plugin-development.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 使用 pymdownx 的 slugify 以保留中文標題錨點（與 GitHub 的錨點一致）。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: 简体中文
      link: /zh/
      lang: zh
    - name: 繁體中文
      link: /zh-hant/
      lang: zh-Hant
    - name: 日本語
      link: /ja/
      lang: ja
    - name: Русский
      link: /ru/
      lang: ru
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AXmishell/LACTSSL
      name: GitHub 儲存庫
