name: Security

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）扫描一次，捕获代码未变但新披露的漏洞
    - cron: "17 3 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  GOVULNCHECK_VERSION: v1.9.0
  GOVULNCHECK: ${{ github.workspace }}/.bin/govulncheck

jobs:
  govulncheck:
    name: govulncheck (dependency vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # 上传 SARIF 到 Code scanning 需要
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        shell: bash
        run: |
          mkdir -p "$(dirname "$GOVULNCHECK")"
          GOBIN="$(dirname "$GOVULNCHECK")" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$GOVULNCHECK" -version

      - name: Scan (SARIF)
        shell: bash
        run: |
          "$GOVULNCHECK" -format sarif ./... > govulncheck.sarif
          python3 -c "import json;d=json.load(open('govulncheck.sarif'));print('SARIF runs:',len(d.get('runs',[])))"

      - name: Upload SARIF to code scanning
        # fork PR 的 token 只读，无法上传，跳过即可
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

      - name: Fail on findings
        # sarif 格式始终返回 0，这里用 text 模式做门禁（有漏洞时退出码 3）
        shell: bash
        run: '"$GOVULNCHECK" ./...'

  gosec:
    name: gosec (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # 上传 SARIF 到 Code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        shell: bash
        run: |
          mkdir -p .bin
          GOBIN="$PWD/.bin" go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0

      - name: Scan (SARIF)
        # .gosec.json 排除 G301/G302/G306（插件与目录权限）、G304（变量路径
        # 读取）、G703（内部路径写入）等结构上必然误报的规则；新增用户路径
        # 拼接仍需在入口单独校验。-nosec-require-* 要求源码标注必须写明规则
        # ID 与理由。不要加 -quiet：0 条告警时 gosec 不会生成 SARIF 文件，
        # 后续上传会失败。
        shell: bash
        run: ./.bin/gosec -conf .gosec.json -nosec-require-rules -nosec-require-justification -fmt sarif -out gosec.sarif ./... || true

      - name: Upload SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: gosec.sarif
          category: gosec
