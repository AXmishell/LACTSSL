name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  backend:
    name: Backend (gofmt + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check CSR client
        run: |
          python -m py_compile scripts/csr_client.py scripts/check-csr-client-i18n.py scripts/tests/test_csr_client.py
          python scripts/check-csr-client-i18n.py
          python -m unittest discover -s scripts/tests -v

      - name: Check gofmt
        shell: bash
        run: |
          mapfile -t files < <(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w 后重新提交："
            printf '  %s\n' "${files[@]}"
            exit 1
          fi

      - name: Check SQL dialect usage
        run: ./scripts/check-sql-dialect.sh

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  database:
    name: Database compatibility (PostgreSQL 18 + MySQL 5.7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lactssl
          POSTGRES_PASSWORD: lactsslpass
          POSTGRES_DB: lactssl_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lactssl -d lactssl_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: lactssl_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create compatibility databases
        shell: bash
        run: |
          docker exec "$(docker ps -q --filter ancestor=postgres:18)" \
            psql -U lactssl -d lactssl_db -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE lactssl_p1" \
            -c "CREATE DATABASE lactssl_p2" \
            -c "CREATE DATABASE lactssl_p3"
          # mysql 客户端会把多个 -e 用空格拼成同一条语句执行，必须用分号分隔后整体传入。
          docker exec -i "$(docker ps -q --filter ancestor=mysql:5.7)" \
            env MYSQL_PWD=rootpass mysql -uroot --default-character-set=utf8mb4 <<'SQL'
          CREATE DATABASE lactssl_m1 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE DATABASE lactssl_m2 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE DATABASE lactssl_m3 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE USER 'lactssl'@'%' IDENTIFIED BY 'lactsslpass';
          GRANT ALL PRIVILEGES ON lactssl_db.* TO 'lactssl'@'%';
          GRANT ALL PRIVILEGES ON lactssl_m1.* TO 'lactssl'@'%';
          GRANT ALL PRIVILEGES ON lactssl_m2.* TO 'lactssl'@'%';
          GRANT ALL PRIVILEGES ON lactssl_m3.* TO 'lactssl'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Run database compatibility tests
        env:
          LACTSSL_TEST_PG_DSN: postgres://lactssl:lactsslpass@127.0.0.1:5432/lactssl_db?sslmode=disable
          LACTSSL_TEST_PG_DSN_B: postgres://lactssl:lactsslpass@127.0.0.1:5432/lactssl_p2?sslmode=disable
          LACTSSL_TEST_PG_DSN_SAME: postgres://lactssl:lactsslpass@127.0.0.1:5432/lactssl_p3?sslmode=disable
          LACTSSL_TEST_MYSQL_DSN: mysql://lactssl:lactsslpass@127.0.0.1:3306/lactssl_db?tls=disable
          LACTSSL_TEST_MYSQL_DSN_B: mysql://lactssl:lactsslpass@127.0.0.1:3306/lactssl_m2?tls=disable
          LACTSSL_TEST_MYSQL_DSN_SAME: mysql://lactssl:lactsslpass@127.0.0.1:3306/lactssl_m3?tls=disable
          LACTSSL_TEST_MYSQL_CONVERT_DSN: mysql://lactssl:lactsslpass@127.0.0.1:3306/lactssl_m3?tls=disable
        run: go test -race -count=1 -p 1 ./internal/db ./internal/store ./internal/dbconvert

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        # 高危/严重漏洞默认阻断；上游暂无修复版本的工具链漏洞需在 scripts/npm-audit.mjs 登记豁免。
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck scripts
        run: ./node_modules/.bin/tsc -p ../scripts/tsconfig.json

      - name: Check i18n locales
        working-directory: .
        run: node scripts/check-i18n.ts

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  build:
    name: Build binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 需要完整历史与 tag，供 scripts/version.sh 通过 git describe 推导版本号。
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/webui/dist

      - name: Build
        run: |
          BUILD_VERSION=$(./scripts/version.sh)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_ARCH=$(go env GOOS)/$(go env GOARCH)
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -tags embed \
            -ldflags "-s -w -X 'lactssl/internal/api.Version=$BUILD_VERSION' -X 'lactssl/internal/api.BuildTime=$BUILD_TIME' -X 'lactssl/internal/api.BuildArch=$BUILD_ARCH'" \
            -o bin/lactssl ./cmd/server

      - name: Verify binary
        run: |
          test -x bin/lactssl
          ls -lh bin/lactssl

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lactssl-linux-amd64
          path: bin/lactssl
          retention-days: 7
