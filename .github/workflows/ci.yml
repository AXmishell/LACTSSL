name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  backend:
    name: Backend (gofmt + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check CSR client
        run: |
          python -m py_compile scripts/csr_client.py scripts/check-csr-client-i18n.py scripts/tests/test_csr_client.py
          python scripts/check-csr-client-i18n.py
          python -m unittest discover -s scripts/tests -v

      - name: Check gofmt
        shell: bash
        run: |
          mapfile -t files < <(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w 后重新提交："
            printf '  %s\n' "${files[@]}"
            exit 1
          fi

      - name: Check SQL dialect usage
        run: ./scripts/check-sql-dialect.sh

      - name: go vet
        run: go vet ./...

      - name: plugin metadata
        working-directory: internal/plugin
        run: go run ./scripts/metadatacheck/main.go

      - name: plugin import boundaries
        shell: bash
        run: |
          if go list -f '{{.ImportPath}} {{join .Imports " "}}' ./internal/plugin/host/... | grep -qE 'lactssl/providers/(dns|deploy|notify)'; then
            echo "host 层不得依赖 providers 实现（api/catalog 除外）" >&2
            go list -f '{{.ImportPath}} {{join .Imports " "}}' ./internal/plugin/host/... | grep -E 'lactssl/providers/(dns|deploy|notify)' >&2
            exit 1
          fi
          if go list -f '{{.ImportPath}} {{join .Imports " "}}' ./internal/plugin/runtime/... | grep -qE 'internal/plugin/(host|providers)'; then
            echo "runtime 层不得依赖 host/providers" >&2
            go list -f '{{.ImportPath}} {{join .Imports " "}}' ./internal/plugin/runtime/... | grep -E 'internal/plugin/(host|providers)' >&2
            exit 1
          fi

      - name: plugin module boundaries
        shell: bash
        run: |
          if go list -deps -tags nobuiltin_dns ./cmd/server | grep -q 'go-acme/lego/v5'; then
            echo "nobuiltin_dns 构建仍依赖 lego v5" >&2
            exit 1
          fi
          if (cd internal/plugin/providers && go list -deps ./... | grep -q '^lactssl/internal'); then
            echo "providers module 不得依赖宿主 internal 包" >&2
            exit 1
          fi

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: plugin build profiles
        run: |
          for tags in nobuiltin_dns dns_providers_common dns_providers_minimal; do
            CGO_ENABLED=0 go build -trimpath -tags "$tags nomsgpack validator_novalidatefn" -o /dev/null ./cmd/server
          done

      - name: plugin module test
        working-directory: plugins
        run: go vet ./... && go test ./...

      - name: providers module test
        working-directory: internal/plugin/providers
        run: go vet ./... && go test ./...

      # 漏洞门禁统一放在 security.yml：同一 commit 只扫一次，避免 CI 反馈时间翻倍。
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  database:
    name: Database compatibility (PostgreSQL 18 + MySQL 5.7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lactssl
          POSTGRES_PASSWORD: lactsslpass
          POSTGRES_DB: lactssl_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lactssl -d lactssl_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: lactssl_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create compatibility databases
        shell: bash
        run: |
          docker exec "$(docker ps -q --filter ancestor=postgres:18)" \
            psql -U lactssl -d lactssl_db -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE lactssl_p1" \
            -c "CREATE DATABASE lactssl_p2" \
            -c "CREATE DATABASE lactssl_p3"
          # mysql 客户端会把多个 -e 用空格拼成同一条语句执行，必须用分号分隔后整体传入。
          docker exec -i "$(docker ps -q --filter ancestor=mysql:5.7)" \
            env MYSQL_PWD=rootpass mysql -uroot --default-character-set=utf8mb4 <<'SQL'
          CREATE DATABASE lactssl_m1 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE DATABASE lactssl_m2 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE DATABASE lactssl_m3 CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
          CREATE USER 'lactssl'@'%' IDENTIFIED BY 'lactsslpass';
          GRANT ALL PRIVILEGES ON lactssl_db.* TO 'lactssl'@'%';
          GRANT ALL PRIVILEGES ON lactssl_m1.* TO 'lactssl'@'%';
          GRANT ALL PRIVILEGES ON lactssl_m2.* TO 'lactssl'@'%';
          GRANT ALL PRIVILEGES ON lactssl_m3.* TO 'lactssl'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Run database compatibility tests
        env:
          LACTSSL_TEST_PG_DSN: postgres://lactssl:lactsslpass@127.0.0.1:5432/lactssl_db?sslmode=disable
          LACTSSL_TEST_PG_DSN_B: postgres://lactssl:lactsslpass@127.0.0.1:5432/lactssl_p2?sslmode=disable
          LACTSSL_TEST_PG_DSN_SAME: postgres://lactssl:lactsslpass@127.0.0.1:5432/lactssl_p3?sslmode=disable
          LACTSSL_TEST_MYSQL_DSN: mysql://lactssl:lactsslpass@127.0.0.1:3306/lactssl_db?tls=disable
          LACTSSL_TEST_MYSQL_DSN_B: mysql://lactssl:lactsslpass@127.0.0.1:3306/lactssl_m2?tls=disable
          LACTSSL_TEST_MYSQL_DSN_SAME: mysql://lactssl:lactsslpass@127.0.0.1:3306/lactssl_m3?tls=disable
          LACTSSL_TEST_MYSQL_CONVERT_DSN: mysql://lactssl:lactsslpass@127.0.0.1:3306/lactssl_m3?tls=disable
        run: go test -race -count=1 -p 1 ./internal/db ./internal/store ./internal/dbconvert

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        # 高危/严重漏洞默认阻断；上游暂无修复版本的工具链漏洞需在 scripts/npm-audit.mjs 登记豁免。
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck scripts
        run: ./node_modules/.bin/tsc -p ../scripts/tsconfig.json

      - name: Check i18n locales
        working-directory: .
        run: node scripts/check-i18n.ts

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  build:
    name: Build binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 需要完整历史与 tag，供 scripts/version.sh 通过 git describe 推导版本号。
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/webui/dist

      - name: Compress web assets
        run: go run ./scripts/compress-assets.go internal/webui/dist

      - name: Bundle i18n locales
        run: go run ./scripts/bundle-i18n.go

      - name: Verify embedded i18n
        run: go test -tags embed ./internal/i18n

      - name: Build
        run: |
          BUILD_VERSION=$(./scripts/version.sh)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_ARCH=$(go env GOOS)/$(go env GOARCH)
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -tags "embed nomsgpack validator_novalidatefn" \
            -ldflags "-s -w -X 'lactssl/internal/api.Version=$BUILD_VERSION' -X 'lactssl/internal/api.BuildTime=$BUILD_TIME' -X 'lactssl/internal/api.BuildArch=$BUILD_ARCH'" \
            -o bin/lactssl ./cmd/server

      - name: Verify binary
        env:
          # 默认构建内置全部 lego v5 DNS provider，体积约 80 MiB；32 MiB 预算只适用于
          # `nobuiltin_dns` 等裁剪变体，不要用它卡默认发布构建。
          BINARY_SIZE_BUDGET_MIB: "96"
        run: |
          test -x bin/lactssl
          ls -lh bin/lactssl
          size_bytes=$(wc -c < bin/lactssl)
          budget_bytes=$((BINARY_SIZE_BUDGET_MIB * 1024 * 1024))
          if [ "$size_bytes" -gt "$budget_bytes" ]; then
            awk -v s="$size_bytes" -v b="$budget_bytes" 'BEGIN {
              printf "二进制体积 %.2f MiB 超过 %d MiB 预算（超出 %.2f MiB）；请运行 make size 定位增长来源。\n", s / 1048576, b / 1048576, (s - b) / 1048576
            }' >&2
            exit 1
          fi
          awk -v s="$size_bytes" -v b="$budget_bytes" 'BEGIN {
            printf "二进制体积 %.2f MiB（预算 %d MiB）\n", s / 1048576, b / 1048576
          }'

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lactssl-linux-amd64
          path: bin/lactssl
          retention-days: 7

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # release 工作流用 dist/docker/linux-<arch>/lactssl 作为镜像上下文，
    # 这里复用同一 commit 构建出的二进制，提前验证镜像契约与运行行为，
    # 避免 Dockerfile / .dockerignore / 入口脚本的问题拖到发布时才暴露。
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lactssl-linux-amd64
          path: dist/docker/linux-amd64

      - name: Build image
        shell: bash
        run: |
          chmod 0755 dist/docker/linux-amd64/lactssl
          docker buildx build --load --build-arg VERSION=ci -t lactssl:ci .

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          # 临时目录放在 RUNNER_TEMP 下：容器入口脚本会把 bind mount 的属主改成
          # 10001，若落在带 sticky 位的 /tmp，宿主机 runner 用户无法删除。
          tmp_root="${RUNNER_TEMP:-/tmp}"
          data_dir="$(mktemp -d "$tmp_root/lactssl-smoke-data.XXXXXX")"
          config_dir="$(mktemp -d "$tmp_root/lactssl-smoke-config.XXXXXX")"
          cleanup() {
            docker logs lactssl-ci 2>&1 || true
            docker rm -f lactssl-ci >/dev/null 2>&1 || true
            # 目录已被 chown 给 10001，宿主机无法遍历删除；改用镜像内 root
            # 清空内容，再删空目录。清理失败不应改变冒烟测试结论。
            docker run --rm --user 0 --entrypoint /bin/sh \
              -v "$data_dir:/cleanup-data" -v "$config_dir:/cleanup-config" \
              lactssl:ci -c \
              'rm -rf /cleanup-data/* /cleanup-data/.[!.]* /cleanup-config/* /cleanup-config/.[!.]*' \
              >/dev/null 2>&1 || true
            rm -rf "$data_dir" "$config_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # 与 docker-compose.yml 的安全配置保持一致：只读根文件系统，
          # 丢弃全部 capability 后只保留入口脚本降权所需的最小集合。
          docker run -d --name lactssl-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --cap-add SETUID --cap-add SETGID \
            -e TZ=Asia/Shanghai -e TMPDIR=/app/data/tmp \
            -v "$data_dir:/app/data" -v "$config_dir:/app/config" \
            -p 127.0.0.1:18080:8080 \
            lactssl:ci

          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' lactssl-ci)" = "healthy" ] && break
            sleep 2
          done

          test "$(docker inspect --format '{{.State.Status}}' lactssl-ci)" = "running"
          test "$(docker inspect --format '{{.State.Health.Status}}' lactssl-ci)" = "healthy"

          # 主进程必须以镜像约定的 10001 用户运行，而不是 root。
          docker exec lactssl-ci \
            awk '$1 == "Uid:" { ok = ($2 == 10001 && $3 == 10001) } END { exit !ok }' /proc/1/status

          # 嵌入的前端资源由主进程直接提供。
          curl -fsS -o /dev/null http://127.0.0.1:18080/favicon.svg
