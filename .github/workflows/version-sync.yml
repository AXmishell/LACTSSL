name: Version Sync

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: version-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync VERSION from tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Parse and validate tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' 不是合法的语义化版本，期望格式为 vX.Y.Z（可带 -rc.1 等后缀）"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check tag is on default branch
        id: check
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::warning::tag '$GITHUB_REF_NAME' 指向的提交不在 $DEFAULT_BRANCH 上，跳过 VERSION 同步"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Update VERSION
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ "$current" = "$VERSION" ]; then
            echo "VERSION 已是 $VERSION，无需更新"
            exit 0
          fi

          printf '%s\n' "$VERSION" > VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): $VERSION"

          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              echo "已将 VERSION 更新为 $VERSION 并推送到 $DEFAULT_BRANCH"
              exit 0
            fi

            echo "第 $attempt 次推送失败，尝试同步远端后重试"
            git pull --rebase origin "$DEFAULT_BRANCH" || true
            sleep 3
          done

          echo "::error::VERSION 推送失败。请确认 $DEFAULT_BRANCH 分支保护规则允许 GitHub Actions 写入，或手动将 VERSION 更新为 $VERSION"
          exit 1
