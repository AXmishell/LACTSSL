# Dependabot 依赖更新配置
#
# 设计原则：
# - Go / 前端 / GitHub Actions / 容器镜像分别按周检查，避免每天刷 PR；
# - 先按生态分组，再提供 minor+patch 兜底组，减少 PR 数量；
# - LACTSSL-Plugins 由发布流程与插件协议共同决定，不交给 Dependabot 自动升级；
# - 大版本仍单独开 PR，便于逐个人工评估兼容性。
version: 2

updates:
  # ---------------------------- Go modules ----------------------------
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore
      include: scope
    # 插件仓库版本由发布 tag 固定，升级前需要先发布插件并验证协议兼容。
    ignore:
      - dependency-name: github.com/AXmishell/LACTSSL-Plugins
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
        update-types:
          - minor
          - patch
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
        update-types:
          - minor
          - patch
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3

  # ---------------------------- 前端 npm ----------------------------
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore
      include: scope
    groups:
      vue:
        patterns:
          - vue
          - vue-router
          - vue-i18n
          - "@vue/*"
        update-types:
          - minor
          - patch
      element-plus:
        patterns:
          - element-plus
          - "@element-plus/*"
        update-types:
          - minor
          - patch
      frontend-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - typescript
          - vue-tsc
          - "@types/*"
        update-types:
          - minor
          - patch
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3

  # ---------------------------- GitHub Actions ----------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    rebase-strategy: auto
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  # ---------------------------- Dockerfile ----------------------------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    rebase-strategy: auto
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  # ---------------------------- docker-compose ----------------------------
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    rebase-strategy: auto
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
