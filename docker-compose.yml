services:
  lactssl:
    # 生产建议固定到具体版本或 digest；升级时显式修改 tag。
    image: ghcr.io/axmishell/lactssl:${LACTSSL_IMAGE_TAG:-1.0.8}
    restart: unless-stopped
    # 默认只绑定回环，由本机反向代理终止 TLS；如确需对局域网开放请显式修改。
    ports: ["127.0.0.1:8080:8080"]
    environment:
      TZ: Asia/Shanghai
      TMPDIR: /app/data/tmp
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    init: true
    pids_limit: 512
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [1panel-network]

networks:
  1panel-network:
    external: true
