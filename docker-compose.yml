services:
  # 可选 PostgreSQL 18：docker compose --profile postgres up -d
  # 然后在 /upgrade 的“数据库转换”中把 DSN 指向 postgres:5432/lactssl。
  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: lactssl
      POSTGRES_USER: lactssl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      TZ: Asia/Shanghai
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lactssl -d lactssl"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 1panel-network

  lactssl:
    # 默认使用 GHCR 上发布的镜像。固定版本时直接修改这里的标签，
    # 例如 ghcr.io/axmishell/lactssl:1.2.3。
    image: ghcr.io/axmishell/lactssl:latest
    # 本地构建时取消下面注释；镜像名仍使用上面的 image。
    # build:
    #   context: .
    #   # 镜像内没有 .git，版本号需显式传入：LACTSSL_VERSION=1.2.3 docker compose up -d --build
    #   args:
    #     VERSION: ${LACTSSL_VERSION:-dev}
    restart: unless-stopped
    # 根文件系统只读，仅数据/配置卷与 /tmp 可写，降低命令执行后的持久化能力。
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    init: true
    pids_limit: 512
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 入口脚本以 root 修正卷权限后通过 su-exec 降权，仅保留必要能力。
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # 备份/日志导出等临时文件写入数据卷，避免占满 256 MiB 的 /tmp tmpfs。
      TMPDIR: /app/data/tmp
    # 应用默认把访问日志同时写到 stdout；限制 json-file 大小，避免无限增长。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - 1panel-network

# 默认沿用 1Panel 的外部网络。不使用 1Panel 时，删除服务下的 networks
# 和文件末尾的 networks 段，让 Compose 使用默认网络；否则 docker compose up
# 会因外部网络不存在而失败。
networks:
  1panel-network:
    external: true
