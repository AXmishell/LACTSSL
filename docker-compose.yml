services:
  lactssl:
    image: ghcr.io/axmishell/lactssl:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      TZ: Asia/Shanghai
      TMPDIR: /app/data/tmp
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    init: true
    pids_limit: 512
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [1panel-network]

networks:
  1panel-network:
    external: true
