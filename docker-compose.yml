services:
  lactssl:
    # 默认使用 GHCR 上发布的镜像；可用 LACTSSL_VERSION 固定版本，例如 LACTSSL_VERSION=1.2.3
    image: ghcr.io/axmishell/lactssl:${LACTSSL_VERSION:-latest}
    # 本地构建时取消下面注释，并去掉上面的 image 行：
    # build:
    #   context: .
    #   # 镜像内没有 .git，版本号需显式传入：LACTSSL_VERSION=1.2.3 docker compose up -d --build
    #   args:
    #     VERSION: ${LACTSSL_VERSION:-dev}
    container_name: lactssl
    restart: unless-stopped
    # 根文件系统只读，仅数据/配置卷与 /tmp 可写，降低命令执行后的持久化能力。
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    init: true
    pids_limit: 512
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 入口脚本以 root 修正卷权限后通过 su-exec 降权，仅保留必要能力。
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - 1panel-network

# 默认沿用 1Panel 的外部网络；不使用 1Panel 时删除上面两行，改为共享默认网络：
#    networks:
#      - default
networks:
  1panel-network:
    external: true
