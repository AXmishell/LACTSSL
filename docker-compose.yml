services:
  lactssl:
    # 默认使用 GHCR 上发布的镜像；也可改为指定版本，如 ghcr.io/axmishell/lactssl:1.2.3
    image: ghcr.io/axmishell/lactssl:latest
    # 本地构建时取消下面注释，并去掉上面的 image 行：
    # build:
    #   context: .
    #   # 镜像内没有 .git，版本号需显式传入：LACTSSL_VERSION=1.2.3 docker compose up -d --build
    #   args:
    #     VERSION: ${LACTSSL_VERSION:-dev}
    container_name: lactssl
    restart: unless-stopped
    # 根文件系统只读，仅数据/配置卷与 /tmp 可写，降低命令执行后的持久化能力。
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    init: true
    pids_limit: 512
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 入口脚本以 root 修正卷权限后通过 su-exec 降权，仅保留必要能力。
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    ports:
      - "8080:8080"
    environment:
      LACTSSL_DATA: /app/data
      LACTSSL_CONFIG: /app/config/config.yaml
      TZ: Asia/Shanghai
      # 如需固定安全入口，取消下一行注释并修改（首次启动也会随机生成并打印到日志）
      # LACTSSL_ENTRY: my-secret-entry
      # 经过反向代理时，填写可信代理 CIDR，否则按 IP 限流会全部落到代理 IP 上
      # LACTSSL_TRUSTED_PROXIES: 127.0.0.1,10.0.0.0/8
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
